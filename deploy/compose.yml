# Production: the whole site on one server.
# Usage (from this folder): docker compose up -d --build
#
# Only Caddy publishes ports (80/443). Everything else talks over the
# project's private network: Docker opens published ports in the firewall
# itself, so publishing nothing else is what keeps them private.
name: taklifim

# Logs go to the systemd journal, which keeps them 30 days (see README:
# that's the period the privacy policy states). `docker compose logs` still
# works.
x-logging: &logging
  driver: journald
  options:
    tag: "{{.Name}}"

services:
  # HTTPS (automatic Let's Encrypt certificates) and routing.
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      FILES_DOMAIN: ${FILES_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  web:
    image: taklifim-web:prod
    build:
      context: ../frontend
      target: production
      args:
        SITE_URL: https://${SITE_DOMAIN}
    environment:
      API_URL: http://api:3000
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      # Caddy is the one proxy in front (it sets X-Forwarded-For itself).
      TRUSTED_PROXY_COUNT: 1
      SITE_URL: https://${SITE_DOMAIN}
      ALERT_TELEGRAM_BOT_TOKEN: ${ALERT_TELEGRAM_BOT_TOKEN:-}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
      YANDEX_MAPS_API_KEY: ${YANDEX_MAPS_API_KEY:-}
      YANDEX_MAPS_SUGGEST_API_KEY: ${YANDEX_MAPS_SUGGEST_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  # Runs pending database migrations on start.
  api:
    image: taklifim-api:prod
    build:
      context: ../backend
      target: production
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      # Only the Next.js server calls the API; it passes the visitor's IP
      # with the internal secret, so no proxy is trusted here.
      TRUST_PROXY: 0
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_PUBLIC_URL: https://${FILES_DOMAIN}/${S3_BUCKET}
      SITE_URL: https://${SITE_DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *logging

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging

  # OTP codes and rate limits only: nothing here needs backing up.
  redis:
    image: redis:7-alpine
    command: ["sh", "-c", 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging

  # Uploaded photos and music. Chainguard only publishes :latest for free,
  # so it's pinned by digest; update it on purpose (see README).
  minio:
    image: cgr.dev/chainguard/minio:latest@sha256:59667194421209c2c1eacbe761e24787e047985c5dfa96b15da9b59fe9b55cd0
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      MINIO_BROWSER: "off"
      MC_HOST_local: http://${S3_ACCESS_KEY}:${S3_SECRET_KEY}@localhost:9000
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging

  # One-off: creates the bucket and makes its objects publicly readable by
  # exact key only. (mc's "download" preset also allows listing, which would
  # hand out every photo's unguessable URL.)
  minio-init:
    image: cgr.dev/chainguard/minio:latest@sha256:59667194421209c2c1eacbe761e24787e047985c5dfa96b15da9b59fe9b55cd0
    entrypoint: ["sh", "-c"]
    command:
      - >
        mc mb --ignore-existing local/$${S3_BUCKET} &&
        printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::%s/*"]}]}' "$${S3_BUCKET}" > /tmp/policy.json &&
        mc anonymous set-json /tmp/policy.json local/$${S3_BUCKET}
    environment:
      S3_BUCKET: ${S3_BUCKET}
      MC_HOST_local: http://${S3_ACCESS_KEY}:${S3_SECRET_KEY}@minio:9000
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  minio_data:
